<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{%block title%}My Map{%endblock%}</title>

    {% block css %} {% endblock %}

    
</head>
<body>
    {% block js %} {% endblock %}

    <div id="city-search-box">
        <input type="text" id="city-search-input" placeholder="Search city..." />
        <button id="city-search-btn">Search</button>
        <p id="city-search-error"></p>
    </div>

    <div id="map"></div>
    {% block content %} {% endblock %}
    
</body>
</html>
